; Laraflare Base PHP Configuration
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
max_execution_time = 300
max_input_time = 60
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
display_startup_errors = On
post_max_size = 100M
upload_max_filesize = 100M
default_mimetype = "text/html"
default_charset = "UTF-8"

; Laraflare Extensions
extension_dir = "ext"
extension=mysqli
extension=pdo_mysql
extension=mbstring
extension=openssl
extension=curl
extension=fileinfo
extension=gd
extension=zip
