; Laraflare Optimized Base PHP Configuration
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 256M
upload_max_filesize = 256M
max_input_vars = 5000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
display_startup_errors = On
log_errors = On
default_mimetype = "text/html"
default_charset = "UTF-8"

[Date]
date.timezone = UTC

[Session]
session.gc_maxlifetime = 14400

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0

; Laraflare Extensions
extension_dir = "ext"
extension=mysqli
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=curl
extension=fileinfo
extension=gd
extension=exif
extension=intl
extension=zip
